name: "Extract, transform and alert"

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked

      - id: download
        name: Download
        run: make download
        shell: bash

      - id: transform
        name: Identify new requests
        run: make transform
        shell: bash

#       - id: twitter
#         name: Send tweets
#         run: make tweet
#         shell: bash
#         env:
#           TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
#           TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
#           TWITTER_ACCESS_TOKEN_KEY: ${{ secrets.TWITTER_ACCESS_TOKEN_KEY }}
#           TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}

      - id: toot
        name: Send toots
        run: make toot
        shell: bash
        env:
          MASTODON_CLIENT_KEY: ${{ secrets.MASTODON_CLIENT_KEY }}
          MASTODON_CLIENT_SECRET: ${{ secrets.MASTODON_CLIENT_SECRET }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}

      - id: commit
        name: Commit
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config pull.rebase false
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add ./
          git diff --cached --quiet || git commit -m "Added latest ETL" --author="palewire <palewire@users.noreply.github.com>"
          git push
        shell: bash
