[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "muckrockbot"
version = "0.1.0"
description = "Posts the latest public records requests filed and completed at MuckRock."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1.3",
    "Mastodon.py>=1.8.1",
    "python-dateutil>=2.8.2",
    "python-muckrock==2.3.0",
    "python-twitter>=3.5",
    "pytz>=2022.6",
    "requests>=2.32",
    "rich>=12.6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16.3",
    "ty>=0.0.1",
]

[tool.setuptools.packages.find]
include = ["muckrockbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["muckrockbot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [
    ".git",
    ".venv",
    ".github",
    "__pycache__",
    "build",
    "data",
    "tests",
]
