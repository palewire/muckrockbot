name: "Extract, transform and alert"

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Save all public requests without posting; acknowledges anonymous-feed exclusions may differ"
        type: boolean
        default: false
  schedule:
    - cron: "30 * * * *"

concurrency:
  group: muckrockbot-etl
  cancel-in-progress: false

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked

      - id: preflight
        name: Check API v1 access with requests
        run: |
          uv run python - <<'PY'
          import os

          import requests

          response = requests.get(
              "https://www.muckrock.com/api_v1/foia/",
              headers={"Authorization": f"Token {os.environ['MUCKROCK_API_TOKEN']}"},
              timeout=30,
          )
          response.raise_for_status()
          print(f"Authenticated MuckRock API v1 access succeeded ({response.status_code}).")
          PY
        env:
          MUCKROCK_API_TOKEN: ${{ secrets.MUCKROCK_API_TOKEN }}

      - id: check
        name: Check authenticated access without saving or posting
        if: vars.MUCKROCK_PUBLIC_FEED_APPROVED != 'true' && !inputs.baseline
        run: uv run python -m muckrockbot.download --check
        env:
          MUCKROCK_API_TOKEN: ${{ secrets.MUCKROCK_API_TOKEN }}

      - id: download
        name: Download
        if: vars.MUCKROCK_PUBLIC_FEED_APPROVED == 'true' || inputs.baseline
        run: make download
        shell: bash
        env:
          MUCKROCK_API_TOKEN: ${{ secrets.MUCKROCK_API_TOKEN }}
          MUCKROCK_PUBLIC_FEED_APPROVED: "true"

      - id: transform
        name: Identify new requests
        if: vars.MUCKROCK_PUBLIC_FEED_APPROVED == 'true' && !inputs.baseline
        run: make transform
        shell: bash

#       - id: twitter
#         name: Send tweets
#         run: make tweet
#         shell: bash
#         env:
#           TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
#           TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
#           TWITTER_ACCESS_TOKEN_KEY: ${{ secrets.TWITTER_ACCESS_TOKEN_KEY }}
#           TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}

      - id: toot
        name: Send toots
        if: vars.MUCKROCK_PUBLIC_FEED_APPROVED == 'true' && !inputs.baseline
        run: make toot
        shell: bash
        env:
          MASTODON_CLIENT_KEY: ${{ secrets.MASTODON_CLIENT_KEY }}
          MASTODON_CLIENT_SECRET: ${{ secrets.MASTODON_CLIENT_SECRET }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}

      - id: commit
        name: Commit
        if: vars.MUCKROCK_PUBLIC_FEED_APPROVED == 'true' || inputs.baseline
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config pull.rebase false
          git add data/submitted data/completed
          git diff --cached --quiet || git commit -m "Added latest ETL" --author="palewire <palewire@users.noreply.github.com>"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
        shell: bash
